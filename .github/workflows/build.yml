name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: python -m pip install "jupyter-builder>=1.0.2,<2.0.0a0"

      - name: Lint the extension
        run: |
          set -eux
          pnpm install --frozen-lockfile
          pnpm run lint:check

      - name: Build the extension
        run: |
          set -eux
          python -m pip install .

      - name: Validate metapackage
        run: |
          set -eux

          # The bundled extensions (pulled in transitively via xtralab's
          # dependencies, including ajlab's) should all be present and OK
          # in the labextension list. Case-sensitive OK avoids spurious
          # matches against words like "took".
          jupyter labextension list 2>&1 | tee labextensions.txt
          for ext in \
            "xtralab" \
            "jupyterlab-day" \
            "jupyterlab-night" \
            "jupyterlab-cursor-light" \
            "jupyterlab-cursor-dark" \
            "jupyterlab-quickopen" \
            "jupyterlab-search-replace" \
            "jupyterlab-commands-toolkit"; do
            grep -e "${ext}.*OK" labextensions.txt
          done

          # @jupyter/docprovider-extension comes from ajlab's jupyter-docprovider
          # (3.0.0a0), which targets @jupyter/ydoc ^4 to match JupyterLab 4.6, so
          # it resolves cleanly against the host. Its plugins stay inert because
          # xtralab ships disableRTC, but the bundle must still resolve OK.
          grep -e "@jupyter/docprovider-extension.*OK" labextensions.txt

          # xtralab keeps the @jupyterlab/git frontend enabled and only
          # disables its diff plugins (xtralab registers its own diff
          # providers in their place). The extension itself should be
          # enabled + OK, and the three upstream diff plugins should be
          # listed under "Disabled extensions:".
          grep -e "@jupyterlab/git v.*OK" labextensions.txt
          for plugin in \
            "@jupyterlab/git:notebook-diff" \
            "@jupyterlab/git:plain-text-diff" \
            "@jupyterlab/git:image-diff"; do
            grep -e "${plugin}" labextensions.txt
          done

          # xtralab ships a labconfig fragment that turns off real-time
          # collaboration (disableRTC) and disables the announcements
          # plugin and a few other panels. Verify it lands at the install
          # prefix.
          PREFIX=$(python -c 'import sysconfig; print(sysconfig.get_paths()["data"])')
          test -f "$PREFIX/etc/jupyter/labconfig/page_config.d/00-xtralab.json"

          # Server extensions: jupyterlab-git for the changes panel, plus
          # ajlab's MCP bridge for agents.
          jupyter server extension list 2>&1 | tee server-extensions.txt
          for ext in \
            "jupyterlab_git" \
            "jupyter_server_mcp"; do
            grep -e "${ext}.*OK" server-extensions.txt
          done

          # jupyter-server-ydoc also comes with ajlab, but xtralab is a
          # single-user app whose files are routinely edited out-of-band
          # by coding agents, and replaying stored Y history against such
          # files corrupts open documents. A config drop-in keeps the
          # extension installed but disabled.
          grep -e "jupyter_server_ydoc.*disabled" server-extensions.txt

      - name: Package the extension
        run: |
          set -eux

          pip install build
          python -m build
          pip uninstall -y "xtralab" jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: extension-artifacts
          path: dist/xtralab*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: 'x64'
      - uses: actions/download-artifact@v8
        with:
          name: extension-artifacts
      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          pip install "jupyterlab>=4.6.0b0,<5" xtralab*.whl

          jupyter labextension list 2>&1 | tee labextensions.txt
          grep -e "xtralab.*OK" labextensions.txt
          grep -e "@jupyterlab/git v.*OK" labextensions.txt

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
        with:
          # The docs site only exists once the docs workflow has deployed
          # from main, so the link is dead on the PR that introduces it.
          ignore_links: 'https://jtpio.github.io/xtralab.*'
