[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xtralab-desktop"
version = "0.14.1"
description = "Desktop runtime helpers for the xtralab Electron shell. Not published to PyPI."
requires-python = ">=3.13"
dependencies = ["xtralab"]

[project.scripts]
xtralab = "xtralab_desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["xtralab_desktop"]

[tool.uv.sources]
xtralab = { path = "..", editable = false }

[tool.uv]
prerelease = "allow"
# prerelease = "allow" is needed for the ydoc chain, but the shipped
# JupyterLab should stay on stable releases.
constraint-dependencies = ["jupyterlab<4.7.0a0"]
