name: Desktop Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: xtralab-macos-arm64
            artifact-paths: |
              desktop/out/make/**/*.dmg
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: xtralab-linux-x64
            artifact-paths: |
              desktop/out/make/**/*.AppImage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install Python build tools
        run: python -m pip install "jupyter-builder>=0.0.8,<0.1.0a0" uv

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build TypeScript
        working-directory: desktop
        run: npm run build

      - name: Verify desktop lockfile is in sync
        working-directory: desktop
        run: uv lock --check

      - name: Export requirements lock
        working-directory: desktop
        run: npm run build:lock

      - name: Build wheelhouse
        working-directory: desktop
        run: npm run build:wheelhouse

      - name: Build Python wheel
        working-directory: desktop
        run: npm run build:python

      - name: Build Python runtime
        working-directory: desktop
        run: npm run build:runtime

      - name: Make distribution
        working-directory: desktop
        run: npx electron-forge make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          retention-days: 30
