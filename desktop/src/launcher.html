<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xtralab</title>
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <main class="shell">
      <section class="header" aria-label="xtralab">
        <img class="brand-icon" src="../assets/jupyter.svg" alt="" />
        <div>
          <h1>xtralab</h1>
          <p class="subtitle">Agent-ready JupyterLab, with extras.</p>
        </div>
      </section>

      <button class="primary-action" id="open-folder" type="button">
        Open Folder
      </button>

      <section class="project" id="project-section" aria-label="Project" hidden>
        <div class="section-title">Project</div>
        <div class="project-folder">
          <span class="folder-name" id="project-folder-name"></span>
          <span class="folder-path" id="project-folder-path"></span>
        </div>

        <label class="field-label" for="environment-select">
          Python Environment
        </label>
        <select class="environment-select" id="environment-select"></select>
        <p class="environment-detail" id="environment-detail"></p>

        <div class="project-actions">
          <button class="secondary-action" id="choose-interpreter" type="button">
            Choose Interpreter
          </button>
          <button class="primary-action launch-action" id="launch-folder" type="button">
            Open in xtralab
          </button>
        </div>
      </section>

      <section class="recent" id="recent-section" aria-label="Recent folders">
        <div class="section-title">Recent Folders</div>
        <div class="recent-list" id="recent-list"></div>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./launcher.js"></script>
  </body>
</html>
