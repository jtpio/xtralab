[build-system]
requires = ["hatchling", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "xtralab-monorepo"
description = "Monorepo root for xtralab and xtralite"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.sdist]
include = []

[tool.jupyter-releaser]
# Skip check-npm: it runs a fresh `npm install` on the built tarball (no
# lockfile), so a floating transitive range can pull a mismatched or
# yet-unpublished upstream release. Our builds are reproducible from
# pnpm-lock.yaml, but a published package can't ship that lock. Revisit if
# the npm packages must install standalone.
skip = ["check-npm"]

[tool.jupyter-releaser.options]
# The releaser runs this in each Python package folder; the script bumps every
# package at once, and `--skip-if-dirty` makes the next runs no-ops.
version_cmd = "cd ../.. && python scripts/bump_version.py --skip-if-dirty"
python_packages = [
    "python/xtralab",
    "python/xtralite",
]

[tool.jupyter-releaser.hooks]
after-bump-version = ["python scripts/sync-desktop-version.py"]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.0.2,<2.0.0a0'",
    "npm install -g pnpm@10.28.0",
    "pnpm install",
    "pnpm build:prod"
]
before-build-python = ["pnpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
