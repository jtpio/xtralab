[build-system]
requires = [
    "hatchling>=1.5.0",
    "hatch-jupyter-builder>=0.5",
    "jupyter-builder>=1.0.2,<2.0.0a0",
]
build-backend = "hatchling.build"

[project]
name = "xtralab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
description = "An opinionated JupyterLab meta-package that bundles a curated set of extensions, ships a path-first file browser, renders jupyterlab-git's text, notebook and image diffs with its own viewers, and applies a quieter default workspace configuration."
authors = [
    { name = "Jeremy Tuloup" },
]
keywords = ["jupyter", "jupyterlab", "meta-package"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ajlab>=0.1.11",
    "jupyter-server-mcp>=0.4.1",
    "jupyterlab>=4.6.2",
    "jupyterlab-commands-toolkit>=0.3.0",
    "jupyterlab-cursor-light>=1.0.2",
    "jupyterlab-cursor-dark>=1.0.2",
    "jupyterlab-day>=0.2.0",
    "jupyterlab-git>=0.54.0",
    "jupyterlab-git-core>=0.54.0",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-night>=0.5.2",
    "jupyterlab-pierre-light>=0.1.1",
    "jupyterlab-pierre-dark>=0.1.1",
    "jupyterlab-quickopen>=2.3.0",
    "jupyterlab-search-replace>=1.1.3",
    "jupyterlab-vim>=4.1.4",
    "platformdirs>=2.5",
    "psutil>=5.9",
    "ty>=0.0.65",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jtpio/xtralab"
Documentation = "https://jtpio.github.io/xtralab/"
"Bug Tracker" = "https://github.com/jtpio/xtralab/issues"
Repository = "https://github.com/jtpio/xtralab.git"

[project.scripts]
xtralab = "xtralab.cli:main"

[tool.hatch.version]
path = "xtralab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["xtralab"]

[tool.hatch.build.targets.wheel.shared-data]
"xtralab/labextension" = "share/jupyter/labextensions/xtralab"
"install.json" = "share/jupyter/labextensions/xtralab/install.json"
"jupyter-config/labconfig" = "etc/jupyter/labconfig"
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"
"jupyter-config/jupyter_jupyter_server_mcp_config.json" = "etc/jupyter/jupyter_jupyter_server_mcp_config.json"

[tool.hatch.build.targets.sdist]
artifacts = ["xtralab/labextension"]
exclude = [".github"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "xtralab/labextension/static/style.js",
    "xtralab/labextension/package.json",
]
skip-if-exists = ["xtralab/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["pnpm"]
path = "../.."

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["pnpm"]
path = "../.."
source_dir = "../../packages/xtralab/src"
build_dir = "xtralab/labextension"

[tool.check-wheel-contents]
ignore = ["W002"]
