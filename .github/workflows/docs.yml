name: Docs

on:
  push:
    branches: main
    paths:
      - 'docs/**'
      - 'lite/**'
      - 'packages/**'
      - 'python/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'lite/**'
      - 'packages/**'
      - 'python/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build the site
        working-directory: docs
        run: pnpm build

      # The xtralite demo, served under /lite next to the docs.
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # jupyterlite-terminal fetches the wasm shell commands with micromamba.
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: none

      - name: Install xtralab and xtralite
        run: |
          set -eux
          python -m pip install "jupyter-builder>=1.0.2,<2.0.0a0"
          pnpm install --frozen-lockfile
          python -m pip install ./python/xtralab ./python/xtralite

      - name: Build the JupyterLite site
        working-directory: lite
        run: jupyter lite build

      - name: Test the JupyterLite site
        working-directory: lite
        run: |
          set -eux
          npm install --no-package-lock
          npx playwright install chromium --with-deps
          npx playwright test

      - name: Add the JupyterLite site to the docs
        run: cp -r lite/dist docs/dist/lite

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  # Publishes only from main; pull requests and other branches stop at build.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
