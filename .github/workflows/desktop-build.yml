name: Desktop Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: xtralab-macos-arm64
            artifact-paths: |
              desktop/out/make/**/*.dmg
            installer-glob: '*.dmg'
            platform: darwin-arm64
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: xtralab-linux-x64
            artifact-paths: |
              desktop/out/make/**/*.AppImage
            installer-glob: '*.AppImage'
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Python build tools
        run: python -m pip install "jupyter-builder>=0.0.8,<0.1.0a0" uv

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        working-directory: desktop
        run: pnpm build

      - name: Verify desktop lockfile is in sync
        working-directory: desktop
        run: uv lock --check

      - name: Export requirements lock
        working-directory: desktop
        run: pnpm build:lock

      - name: Build wheelhouse
        working-directory: desktop
        run: pnpm build:wheelhouse

      - name: Build Python wheel
        working-directory: desktop
        run: pnpm build:python

      - name: Build Python runtime
        working-directory: desktop
        run: pnpm build:runtime

      - name: Make distribution
        working-directory: desktop
        run: pnpm exec electron-forge make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
          INSTALLER_GLOB: ${{ matrix.installer-glob }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          installer_count=$(find desktop/out/make -type f -name "$INSTALLER_GLOB" | wc -l | tr -d ' ')
          if [ "$installer_count" != "1" ]; then
            echo "::error::Expected exactly one $INSTALLER_GLOB under desktop/out/make, found $installer_count:"
            find desktop/out/make -type f -name "$INSTALLER_GLOB"
            exit 1
          fi
          installer=$(find desktop/out/make -type f -name "$INSTALLER_GLOB")
          ext="${installer##*.}"
          asset_name="xtralab-${version}-${PLATFORM}.${ext}"
          staged="$RUNNER_TEMP/$asset_name"
          cp "$installer" "$staged"
          echo "Uploading $staged to release $TAG"
          gh release upload "$TAG" "$staged" --clobber --repo "$REPO"
