name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: python -m pip install "jupyter-builder>=1.0.2,<2.0.0a0"

      - name: Lint the extension
        run: |
          set -eux
          pnpm install --frozen-lockfile
          pnpm run lint:check

      - name: Build the extensions
        run: |
          set -eux
          python -m pip install ./python/xtralab ./python/xtralite

      - name: Validate metapackage
        run: |
          set -eux

          # The bundled extensions (pulled in transitively via xtralab's
          # dependencies, including ajlab's) should all be present and OK
          # in the labextension list. Case-sensitive OK avoids spurious
          # matches against words like "took".
          jupyter labextension list 2>&1 | tee labextensions.txt
          for ext in \
            "jupyterlab-day" \
            "jupyterlab-night" \
            "jupyterlab-cursor-light" \
            "jupyterlab-cursor-dark" \
            "jupyterlab-quickopen" \
            "jupyterlab-commands-toolkit"; do
            grep -e "${ext}.*OK" labextensions.txt
          done

          # jupyterlab-search-replace 1.1.3 requires @jupyter/react-components
          # and @jupyter/web-components ~0.16, but JupyterLab 4.6.5 ships 0.17,
          # so the list marks it X. It still works with 0.17. Require OK again
          # once a release supports 0.17.
          grep -e "jupyterlab-search-replace.*enabled" labextensions.txt

          # @jupyter/docprovider-extension comes from ajlab's jupyter-docprovider
          # (3.0.0), which targets @jupyter/ydoc ^4 to match JupyterLab 4.6, so
          # it resolves cleanly against the host. Require the strict OK.
          grep -e "@jupyter/docprovider-extension.*OK" labextensions.txt

          grep -e "@jupyterlab/git v.*OK" labextensions.txt

          # xtralab is an application apart from JupyterLab: it installs no
          # extension, settings or server configuration for JupyterLab.
          PREFIX=$(python -c 'import sysconfig; print(sysconfig.get_paths()["data"])')
          test ! -e "$PREFIX/share/jupyter/labextensions/xtralab"
          test ! -e "$PREFIX/share/jupyter/labextensions/xtralite"
          test ! -e "$PREFIX/etc/jupyter/labconfig/page_config.d/00-xtralab.json"
          test ! -e "$PREFIX/etc/jupyter/jupyter_server_config.d/xtralab.json"

          # The xtralab application loads its own extension and keeps the
          # @jupyterlab/git frontend, without the diff plugins that it replaces.
          xtralab --version
          python - <<'EOF'
          from jupyterlab_server.config import get_page_config
          from xtralab import CONFIG_DIR, LABEXTENSIONS_DIR

          config = get_page_config([str(LABEXTENSIONS_DIR)], str(CONFIG_DIR))
          assert [e["name"] for e in config["federated_extensions"]] == ["xtralab"]
          for plugin in (
              "@jupyterlab/git:notebook-diff",
              "@jupyterlab/git:plain-text-diff",
              "@jupyterlab/git:image-diff",
              "@jupyterlab/apputils-extension:announcements",
          ):
              assert plugin in config["disabledExtensions"], plugin
          EOF

          # Server extensions: jupyterlab-git for the changes panel, plus
          # ajlab's docprovider/MCP stack for collaboration.
          jupyter server extension list 2>&1 | tee server-extensions.txt
          for ext in \
            "jupyterlab_git" \
            "jupyter_server_ydoc" \
            "jupyter_server_mcp"; do
            grep -e "${ext}.*OK" server-extensions.txt
          done

          # xtralite adds its application to `jupyter lite build` with an addon.
          python -c "from importlib.metadata import entry_points; assert 'xtralite' in entry_points(group='jupyterlite.addon.v0').names"

      - name: Package the extensions
        run: |
          set -eux

          pip install build
          python -m build python/xtralab --outdir dist
          python -m build python/xtralite --outdir dist
          pip uninstall -y xtralite xtralab jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: extension-artifacts
          path: |
            dist/xtralab*
            dist/xtralite*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: 'x64'
      - uses: actions/download-artifact@v8
        with:
          name: extension-artifacts
      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          pip install "jupyterlab>=4.6.0b0,<5" xtralab*.whl xtralite*.whl

          jupyter labextension list 2>&1 | tee labextensions.txt
          grep -e "@jupyterlab/git v.*OK" labextensions.txt

          # The applications have their extensions in the Python packages.
          xtralab --version
          python -c "from xtralab import LABEXTENSIONS_DIR; assert (LABEXTENSIONS_DIR / 'xtralab' / 'package.json').is_file()"
          python -c "from xtralite.addon import EXTENSIONS; assert all((e / 'package.json').is_file() for e in EXTENSIONS)"

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
        with:
          # The docs site only exists once the docs workflow has deployed
          # from main, so the link is dead on the PR that introduces it.
          ignore_links: 'https://jtpio.github.io/xtralab.*'
